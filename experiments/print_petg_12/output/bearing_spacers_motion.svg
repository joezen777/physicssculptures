<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450"><rect width="1800" height="1450" fill="#f5f8fc"/><g font-family="DejaVu Sans, sans-serif"><text x="50" y="58" font-size="32" fill="#243449" font-weight="bold">BEARING SPACERS: WHAT TOUCHES, WHAT TURNS</text><text x="50" y="94" font-size="21" fill="#243449" font-weight="normal">Four-level flowerpot turbine | Assembly cutaways, not a dimensioned bearing drawing</text><rect x="50" y="117" width="22" height="22" fill="#d99a25" stroke="none" rx="3"/><text x="82" y="136" font-size="19" fill="#243449" font-weight="normal">STATIONARY: spacers + inner rings</text><rect x="560" y="117" width="22" height="22" fill="#1684bb" stroke="none" rx="3"/><text x="592" y="136" font-size="19" fill="#243449" font-weight="normal">ROTATING: housing + outer ring</text><rect x="1070" y="117" width="22" height="22" fill="#64748b" stroke="none" rx="3"/><text x="1102" y="136" font-size="19" fill="#243449" font-weight="normal">Balls roll between the rings</text><rect x="35" y="167" width="860" height="715" fill="white" stroke="none" rx="3"/><rect x="915" y="167" width="850" height="715" fill="white" stroke="none" rx="3"/><text x="60" y="207" font-size="24" fill="#243449" font-weight="bold">A. CENTRAL 608 BEARING ON THE M8 ROD</text><text x="60" y="239" font-size="18" fill="#243449" font-weight="normal">Shown through the axis; left and right are one annular part.</text><rect x="420" y="276" width="80" height="491" fill="#64748b" stroke="none" rx="3"/><path d="M422,290 L498,281" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,305 L498,296" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,320 L498,311" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,335 L498,326" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,350 L498,341" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,365 L498,356" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,380 L498,371" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,395 L498,386" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,410 L498,401" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,425 L498,416" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,440 L498,431" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,455 L498,446" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,470 L498,461" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,485 L498,476" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,500 L498,491" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,515 L498,506" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,530 L498,521" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,545 L498,536" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,560 L498,551" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,575 L498,566" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,590 L498,581" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,605 L498,596" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,620 L498,611" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,635 L498,626" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,650 L498,641" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,665 L498,656" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,680 L498,671" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,695 L498,686" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,710 L498,701" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,725 L498,716" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,740 L498,731" fill="none" stroke="#94a3b8" stroke-width="1"/><path d="M422,755 L498,746" fill="none" stroke="#94a3b8" stroke-width="1"/><rect x="391" y="315" width="24" height="120" fill="#d99a25" stroke="none" rx="3"/><rect x="391" y="575" width="24" height="130" fill="#d99a25" stroke="none" rx="3"/><rect x="505" y="315" width="24" height="120" fill="#d99a25" stroke="none" rx="3"/><rect x="505" y="575" width="24" height="130" fill="#d99a25" stroke="none" rx="3"/><rect x="382" y="435" width="38" height="140" fill="#d99a25" stroke="none" rx="3"/><rect x="500" y="435" width="38" height="140" fill="#d99a25" stroke="none" rx="3"/><rect x="266" y="435" width="38" height="140" fill="#1684bb" stroke="none" rx="3"/><rect x="620" y="435" width="38" height="140" fill="#1684bb" stroke="none" rx="3"/><circle cx="343" cy="505" r="27" fill="#64748b"/><path d="M315,444 L371,444" fill="none" stroke="#9cabb9" stroke-width="4"/><path d="M315,566 L371,566" fill="none" stroke="#9cabb9" stroke-width="4"/><circle cx="577" cy="505" r="27" fill="#64748b"/><path d="M549,444 L605,444" fill="none" stroke="#9cabb9" stroke-width="4"/><path d="M549,566 L605,566" fill="none" stroke="#9cabb9" stroke-width="4"/><rect x="224" y="407" width="40" height="196" fill="#1684bb" stroke="none" rx="3"/><rect x="660" y="407" width="40" height="196" fill="#1684bb" stroke="none" rx="3"/><rect x="224" y="407" width="88" height="26" fill="#1684bb" stroke="none" rx="3"/><rect x="608" y="407" width="92" height="26" fill="#1684bb" stroke="none" rx="3"/><rect x="224" y="577" width="88" height="26" fill="#1684bb" stroke="none" rx="3"/><rect x="608" y="577" width="92" height="26" fill="#1684bb" stroke="none" rx="3"/><path d="M391,435 L415,435" fill="none" stroke="#172c44" stroke-width="5"/><path d="M391,575 L415,575" fill="none" stroke="#172c44" stroke-width="5"/><path d="M505,435 L529,435" fill="none" stroke="#172c44" stroke-width="5"/><path d="M505,575 L529,575" fill="none" stroke="#172c44" stroke-width="5"/><text x="70" y="300" font-size="21" fill="#243449" font-weight="bold">Spacer above</text><path d="M224,305 L398,360" fill="none" stroke="#536478" stroke-width="2"/><text x="70" y="335" font-size="17" fill="#243449" font-weight="normal">Clamped; does NOT turn</text><text x="70" y="470" font-size="21" fill="#1684bb" font-weight="bold">Printed hub</text><path d="M185,478 L236,492" fill="none" stroke="#536478" stroke-width="2"/><text x="70" y="499" font-size="18" fill="#1684bb" font-weight="normal">+ outer ring turn</text><text x="70" y="641" font-size="21" fill="#243449" font-weight="bold">Spacer below</text><path d="M233,637 L398,634" fill="none" stroke="#536478" stroke-width="2"/><text x="70" y="672" font-size="17" fill="#243449" font-weight="normal">Carries inner-ring load</text><text x="595" y="300" font-size="21" fill="#64748b" font-weight="bold">M8 rod: fixed</text><path d="M635,313 L480,326" fill="none" stroke="#536478" stroke-width="2"/><text x="715" y="443" font-size="18" fill="#d99a25" font-weight="bold">Inner ring</text><path d="M706,451 L530,468" fill="none" stroke="#536478" stroke-width="2"/><text x="715" y="471" font-size="17" fill="#243449" font-weight="normal">stays fixed</text><text x="705" y="641" font-size="18" fill="#243449" font-weight="bold">Black lines:</text><text x="705" y="668" font-size="17" fill="#243449" font-weight="normal">contact faces</text><path d="M710,620 L520,575" fill="none" stroke="#536478" stroke-width="2"/><text x="65" y="802" font-size="23" fill="#243449" font-weight="bold">Tube ends touch ONLY the inner-ring faces.</text><text x="65" y="836" font-size="18" fill="#243449" font-weight="normal">Keep clear of shields, balls, outer rings and printed rotating parts.</text><text x="940" y="207" font-size="24" fill="#243449" font-weight="bold">B. PLANET GEAR: 604 BEARING / M4 AXLE</text><rect x="1220" y="279" width="40" height="505" fill="#64748b" stroke="none" rx="3"/><rect x="1183" y="288" width="114" height="30" fill="#d99a25" stroke="none" rx="3"/><text x="1350" y="310" font-size="18" fill="#243449" font-weight="normal">M4 nut + narrow washer: fixed</text><path d="M1337,310 L1280,310" fill="none" stroke="#536478" stroke-width="2"/><rect x="1183" y="318" width="114" height="13" fill="#d99a25" stroke="none" rx="3"/><rect x="1194" y="331" width="20" height="89" fill="#d99a25" stroke="none" rx="3"/><rect x="1266" y="331" width="20" height="89" fill="#d99a25" stroke="none" rx="3"/><text x="1350" y="374" font-size="20" fill="#243449" font-weight="normal">10 mm upper spacer</text><path d="M1337,377 L1280,374" fill="none" stroke="#536478" stroke-width="2"/><rect x="1180" y="420" width="40" height="90" fill="#d99a25" stroke="none" rx="3"/><rect x="1260" y="420" width="40" height="90" fill="#d99a25" stroke="none" rx="3"/><rect x="1080" y="420" width="35" height="90" fill="#1684bb" stroke="none" rx="3"/><rect x="1360" y="420" width="35" height="90" fill="#1684bb" stroke="none" rx="3"/><circle cx="1147" cy="465" r="20" fill="#64748b"/><circle cx="1330" cy="465" r="20" fill="#64748b"/><rect x="1048" y="396" width="30" height="139" fill="#1684bb" stroke="none" rx="3"/><rect x="1397" y="396" width="30" height="139" fill="#1684bb" stroke="none" rx="3"/><rect x="1048" y="396" width="76" height="22" fill="#1684bb" stroke="none" rx="3"/><rect x="1048" y="512" width="76" height="23" fill="#1684bb" stroke="none" rx="3"/><rect x="1351" y="396" width="76" height="22" fill="#1684bb" stroke="none" rx="3"/><rect x="1351" y="512" width="76" height="23" fill="#1684bb" stroke="none" rx="3"/><text x="1460" y="447" font-size="18" fill="#1684bb" font-weight="bold">P07 gear + P08 cap</text><text x="1460" y="477" font-size="18" fill="#1684bb" font-weight="bold">+ outer ring</text><text x="1460" y="507" font-size="18" fill="#1684bb" font-weight="normal">rotate together.</text><path d="M1450,467 L1408,467" fill="none" stroke="#536478" stroke-width="2"/><rect x="1194" y="510" width="20" height="183" fill="#d99a25" stroke="none" rx="3"/><rect x="1266" y="510" width="20" height="183" fill="#d99a25" stroke="none" rx="3"/><text x="1350" y="644" font-size="20" fill="#243449" font-weight="normal">37.2 mm lower spacer</text><path d="M1335,648 L1280,639" fill="none" stroke="#536478" stroke-width="2"/><rect x="1183" y="694" width="114" height="26" fill="#d99a25" stroke="none" rx="3"/><rect x="1080" y="724" width="322" height="35" fill="#64748b" stroke="none" rx="3"/><text x="1430" y="748" font-size="19" fill="#243449" font-weight="normal">P04: fixed</text><path d="M1420,742 L1380,742" fill="none" stroke="#536478" stroke-width="2"/><rect x="1192" y="762" width="96" height="24" fill="#64748b" stroke="none" rx="3"/><text x="940" y="805" font-size="23" fill="#243449" font-weight="bold">Both spacers clamp the 604 INNER ring.</text><text x="940" y="838" font-size="19" fill="#243449" font-weight="normal">Axle bolt, nuts, washer and carrier stay stationary.</text><rect x="35" y="904" width="1730" height="501" fill="white" stroke="none" rx="3"/><text x="60" y="945" font-size="25" fill="#243449" font-weight="bold">C. WHAT ROTATES TOGETHER</text><text x="60" y="977" font-size="20" fill="#243449" font-weight="normal">All CW / CCW directions are viewed from ABOVE. Example: bottom input turns CCW.</text><rect x="60" y="1002" width="1010" height="54" fill="#eaf2f8" stroke="none" rx="3"/><text x="76" y="1036" font-size="20" fill="#243449" font-weight="bold">LEVEL 4</text><text x="212" y="1036" font-size="22" fill="#1684bb" font-weight="bold">CW  8x</text><text x="355" y="1035" font-size="17" fill="#243449" font-weight="normal">P17 top fan + its P01 cap; driven by stage 3 sun</text><rect x="60" y="1067" width="1010" height="54" fill="#eaf2f8" stroke="none" rx="3"/><text x="76" y="1101" font-size="20" fill="#243449" font-weight="bold">LEVEL 3</text><text x="212" y="1101" font-size="22" fill="#1684bb" font-weight="bold">CCW  4x</text><text x="355" y="1100" font-size="17" fill="#243449" font-weight="normal">P02 pot + P09 ring + P11 collar; driven by stage 2 sun</text><rect x="60" y="1132" width="1010" height="54" fill="#eaf2f8" stroke="none" rx="3"/><text x="76" y="1166" font-size="20" fill="#243449" font-weight="bold">LEVEL 2</text><text x="212" y="1166" font-size="22" fill="#1684bb" font-weight="bold">CW  2x</text><text x="355" y="1165" font-size="17" fill="#243449" font-weight="normal">P03 pot + P09 ring + P10 collar; driven by stage 1 sun</text><rect x="60" y="1197" width="1010" height="54" fill="#eaf2f8" stroke="none" rx="3"/><text x="76" y="1231" font-size="20" fill="#243449" font-weight="bold">LEVEL 1</text><text x="212" y="1231" font-size="22" fill="#1684bb" font-weight="bold">CCW  1x</text><text x="355" y="1230" font-size="17" fill="#243449" font-weight="normal">P02 pot + P09 ring + P10 collar + P13-P16 wind drive</text><text x="1110" y="1016" font-size="22" fill="#243449" font-weight="bold">At EACH gear stage:</text><text x="1110" y="1054" font-size="19" fill="#243449" font-weight="normal">Ring (72 teeth): input speed</text><text x="1110" y="1089" font-size="19" fill="#243449" font-weight="normal">Planets (18): same direction, 4x input</text><text x="1110" y="1124" font-size="19" fill="#243449" font-weight="normal">Sun (36): opposite direction, 2x input</text><text x="1110" y="1159" font-size="18" fill="#243449" font-weight="normal">P05 + P06 + attached P01 turn together.</text><text x="1110" y="1192" font-size="18" fill="#243449" font-weight="normal">The sun hex drives the next fan/pot.</text><text x="60" y="1302" font-size="20" fill="#243449" font-weight="bold">FIXED THROUGHOUT: P12 base, M8 rod, all spacers, all bearing inner rings, P04 carriers,</text><text x="60" y="1335" font-size="20" fill="#243449" font-weight="normal">planet axle hardware, and P18/P19 top guard. Planet centers stay in place; they do not orbit.</text><text x="60" y="1375" font-size="18" fill="#243449" font-weight="normal">Reverse the wind input and every rotation arrow reverses. The speed ratios remain unchanged.</text></g></svg>